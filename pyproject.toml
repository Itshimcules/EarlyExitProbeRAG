[project]
name = "probe-aware-tool-harness"
version = "0.1.0"
description = "Backend-agnostic local AI harness for technician wiki workflows and early-exit tool-call experiments."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "mcp>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-anyio>=0.0.0",
]
llama-cpp = [
    "llama-cpp-python>=0.3.0",
]
hf-probe = [
    "torch>=2.3.0",
    "transformers>=4.44.0",
    "accelerate>=0.33.0",
]
turboquant = [
    "turboquant>=0.2.0",
    "torch>=2.3.0",
    "transformers>=4.44.0",
    "accelerate>=0.33.0",
]
vector-db = [
    "chromadb>=0.5.0",
]
all-local = [
    "llama-cpp-python>=0.3.0",
    "turboquant>=0.2.0",
    "torch>=2.3.0",
    "transformers>=4.44.0",
    "accelerate>=0.33.0",
    "chromadb>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
