services:
  vllm:
    image: vllm/vllm-openai:latest
    command:
      - --model
      - TinyLlama/TinyLlama-1.1B-Chat-v1.0
      - --served-model-name
      - sideboard-tech-model
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --api-key
      - local-dev-token
    ports:
      - "8001:8001"
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}

volumes:
  huggingface-cache:

